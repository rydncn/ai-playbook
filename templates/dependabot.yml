# Copy to .github/dependabot.yml. Weekly, grouped updates so dependency PRs
# arrive as a few reviewable batches rather than a stream, and pinned GitHub
# Actions stay current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
