name: CI

# Baseline CI for a TypeScript project. Copy to .github/workflows/ci.yml,
# keep the steps the project has scripts for, and make the jobs required
# status checks on the main branch (rule 9): a pipeline that stops running
# must block merges, not go unnoticed.
#
# Expects a committed package-lock.json, an .nvmrc, and package.json scripts
# typecheck, lint and test:ci (one-shot, never watch mode). Optional:
# check:rules (templates/rule-check) and lint:ratchet (templates/lint-ratchet).
#
# Agents open pull requests as drafts while they work. The quick checks run
# on every push as a backstop; the test job, usually the slowest, waits
# until the pull request is marked ready for review. Drafts can't be merged,
# and marking one ready starts a fresh run, so nothing merges untested, as
# long as branch protection requires the "Tests" check itself, not only
# "Types and lint". Require all three jobs.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are never
# cancelled: each merge gets its own result, so a broken merge can't hide
# behind the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Rule 7: prove the .npmrc hardening (templates/npmrc) takes effect. An
      # npm older than 11.10 ignores min-release-age without a word.
      - name: npm supply-chain settings take effect
        run: |
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 10)) {
              console.error("npm " + process.argv[1] + " ignores min-release-age: use npm 11.10 or later.");
              process.exit(1);
            }' "$(npm --version)"
          test "$(npm config get ignore-scripts)" = "true" || { echo "ignore-scripts is not on: copy templates/npmrc to .npmrc."; exit 1; }
          test "$(npm config get min-release-age)" -ge 1 || { echo "min-release-age is not set."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Uncomment once the project has these scripts and they pass.
      # - name: Rule checks from CLAUDE.md
      #   run: npm run check:rules
      #
      # - name: ESLint ratchet
      #   run: npm run lint:ratchet

  tests:
    name: Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test:ci

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so secrets in earlier commits are found too

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc

      # The lockfile may only point at the npm registry, over HTTPS, with each
      # resolved URL matching its package name and a sha512 integrity hash. A
      # tampered lockfile can quietly send one package somewhere else.
      - name: Lockfile integrity
        run: >-
          npx --yes lockfile-lint@5.0.1 --path package-lock.json --type npm
          --allowed-hosts npm --validate-https --validate-package-names
          --validate-integrity

      # Installed packages carry the registry's signatures and, where
      # published, provenance attestations; this checks them.
      - name: Install dependencies
        run: npm ci

      - name: Registry signatures
        run: npm audit signatures

      # templates/audit: npm audit with a dated allowlist for advisories nobody
      # can fix yet. Plain `npm audit --audit-level=high` has no allowlist, so
      # one unfixable advisory in a build tool turns this red for good.
      - name: Dependency audit
        run: node scripts/audit.mjs scripts/audit-allowlist.json

      # The gitleaks command-line tool, downloaded from its release and checked
      # against a pinned checksum. Free for any repository (its GitHub Action
      # needs a licence for organisation-owned ones), needs no Docker, and the
      # same binary runs locally: `gitleaks git --redact --verbose`, or the
      # project's `npm run scan:secrets`. When updating the version, take the
      # new checksum from that release's gitleaks_<version>_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secrets scan
        run: gitleaks git --redact --verbose

      # zizmor lints the workflows themselves: script injection from pull
      # request titles and branch names, risky triggers such as
      # pull_request_target, over-broad permissions, credentials left on disk,
      # and pinned actions whose commit isn't really theirs (online audits use
      # the job's token). zizmor publishes no checksums; this one was computed
      # from the release download. Update both together.
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$archive"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Workflow security lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
