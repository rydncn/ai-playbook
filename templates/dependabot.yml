# Copy to .github/dependabot.yml. Weekly, grouped updates so dependency PRs
# arrive as a few reviewable batches rather than a stream, and pinned GitHub
# Actions stay current. Major versions are left for a person to plan: they
# usually break the build, and a stream of red Dependabot PRs gets ignored.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
